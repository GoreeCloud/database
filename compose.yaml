name: goreecloud-database

services:
  postgres:
    image: postgres:17.12-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env before starting}
      GC_API_DB_PASSWORD: ${GC_API_DB_PASSWORD:?Generate .env before starting}
      GC_REST_DB_PASSWORD: ${GC_REST_DB_PASSWORD:?Generate .env before starting}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: gc_api
      DB_PASSWORD: ${GC_API_DB_PASSWORD:?}
      GC_ADMIN_TOKEN: ${GC_ADMIN_TOKEN:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]

  rest:
    image: postgrest/postgrest:v16.6
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://gc_rest:${GC_REST_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      PGRST_DB_SCHEMAS: app
      PGRST_DB_ANON_ROLE: gc_anon
      PGRST_DB_MAX_ROWS: "100"
    ports:
      - "127.0.0.1:${REST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:8080"
    depends_on: [api]
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt: [no-new-privileges:true]

networks:
  internal:
    internal: true

volumes:
  pg_data:
