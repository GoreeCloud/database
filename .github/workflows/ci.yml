name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './apps/api[test]'
      - run: python -m compileall -q apps/api/gc_database scripts
      - run: python -m pytest apps/api/tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-database-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - run: python3 scripts/verify_repo.py
      - run: docker compose config --quiet
      - run: test -f .env && ! git ls-files --error-unmatch .env
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start disposable database stack
        run: docker compose up --build -d
      - name: Test authenticated management API and public demo catalog
        run: |
          set -a
          . ./.env
          set +a
          sh scripts/smoke.sh
      - name: Verify authenticated catalog SSE
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/realtime_smoke.py
      - name: Verify bounded private object storage
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/object_storage_smoke.py
      - name: Verify guarded backup CLI and isolated recovery drill
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          backup_dir="$(mktemp -d)"
          trap 'rm -f "$backup_dir/test.backup"; rmdir "$backup_dir"' EXIT
          python3 scripts/backup.py --output "$backup_dir/test.backup" --apply
          python3 scripts/restore_check.py --archive "$backup_dir/test.backup" --apply
      - name: Collect startup logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Stop disposable stack (preserve volume for job cleanup)
        if: always()
        run: docker compose down
