name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './apps/api[test]'
      - run: python -m compileall -q apps/api/gc_database scripts
      - run: python -m pytest apps/api/tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-database-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - run: python3 scripts/verify_repo.py
      - run: python3 scripts/check_migrations.py
      - run: python3 scripts/init_s3_env.py --apply
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.s3.yaml --profile s3-preview config --quiet
      - run: test -f .env && ! git ls-files --error-unmatch .env
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start disposable database stack
        run: docker compose up --build -d
      - name: Test authenticated management API and public demo catalog
        run: |
          set -a
          . ./.env
          set +a
          sh scripts/smoke.sh
      - name: Verify authenticated catalog SSE
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/realtime_smoke.py
      - name: Verify bounded private object storage
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/object_storage_smoke.py
      - name: Verify private metadata-only audit
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/audit_smoke.py
      - name: Verify per-subject PostgreSQL RLS and private note quota
        run: sh scripts/personal_rls_smoke.sh --disposable
      - name: Verify confirmed single-object deletion on disposable database
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/object_deletion_smoke.py --disposable
      - name: Verify aggregate small-object quota in disposable database
        run: sh scripts/quota_smoke.sh --disposable
      - name: Verify guarded backup CLI and isolated recovery drill
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          backup_dir="$(mktemp -d)"
          trap 'rm -f "$backup_dir/test.backup"; rmdir "$backup_dir"' EXIT
          python3 scripts/backup.py --output "$backup_dir/test.backup" --apply
          python3 scripts/restore_check.py --archive "$backup_dir/test.backup" --apply
      - name: Verify administrator write throttling on disposable stack
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/admin_write_smoke.py --disposable
      - name: Collect startup logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Stop disposable stack (preserve volume for job cleanup)
        if: always()
        run: docker compose down

  s3-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated local test credentials
        run: |
          python3 scripts/init_env.py
          python3 scripts/init_s3_env.py --apply
      - name: Validate opt-in S3 Compose overlay
        run: docker compose -f compose.yaml -f compose.s3.yaml --profile s3-preview config --quiet
      - name: Install dedicated S3 protocol test client
        run: python3 -m pip install 'boto3>=1.40,<2'
      - name: Start disposable private SeaweedFS S3 sandbox
        run: docker compose -f compose.yaml -f compose.s3.yaml --profile s3-preview up -d seaweedfs
      - name: Verify SigV4 PUT, GET, LIST and DELETE; deny unsigned bucket listing
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/s3_preview_smoke.py --disposable
      - name: Check container status on failure without printing credential-bearing logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.s3.yaml --profile s3-preview ps
      - name: Stop S3 sandbox without removing persistent volumes
        if: always()
        run: docker compose -f compose.yaml -f compose.s3.yaml --profile s3-preview down
