[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-database-api"
version = "0.1.0"
description = "Least-privilege GoreeCloud Database management API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.15.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["gc_database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
